<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Carcass Duck Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦆</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #0f766e;
      --brand-700: #115e59;
      --brand-100: #ccfbf1;
      --brand-50: #f0fdfa;
      --new: #2563eb;
      --new-100: #dbeafe;
      --new-50: #eff6ff;
      --money: #c2410c;
      --ink: #0f172a;
      --ink-2: #475569;
      --ink-3: #94a3b8;
      --line: #e2e8f0;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --radius: 16px;
      --appbar-h: 64px;
      --bar-h: 84px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 28px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-padding-top: 84px; }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--ink);
      background:
        radial-gradient(1000px 360px at 50% -120px, #ccfbf1 0, transparent 70%),
        var(--bg);
      padding-bottom: calc(var(--bar-h) + 32px + env(safe-area-inset-bottom));
    }

    button, input, select { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    :focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.45);
      outline-offset: 2px;
    }

    /* ===== App bar ===== */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--appbar-h);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(1.4) blur(12px);
      -webkit-backdrop-filter: saturate(1.4) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .appbar-inner {
      max-width: 1120px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), #0ea5e9);
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .appbar h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .appbar .company {
      font-size: 12px;
      color: var(--ink-2);
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }

    /* ===== Pengaturan ===== */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 48px;
      padding: 0 42px 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 14px center / 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      text-overflow: ellipsis;
    }
    .select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18); }
    .select.price { background-color: var(--brand-50); border-color: #99f6e4; color: var(--brand-700); }

    .hint {
      margin: 14px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      font-size: 13px;
      color: var(--ink-2);
    }
    .stamp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-weight: 700;
      font-size: 12px;
    }

    .admin { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
    .admin.show { display: flex; }
    .btn-ghost {
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== Toolbar ===== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      margin: 16px 0 12px;
    }
    .chips {
      flex: 1 1 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chip .count {
      display: none;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
    }
    .chip .count.show { display: inline-flex; }
    .chip[data-filter="NEW"] .count { background: var(--new); }

    .search {
      flex: 0 0 240px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 14px;
    }
    .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18); }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      user-select: none;
    }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .track {
      width: 40px;
      height: 24px;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
      transition: background 0.15s ease;
      flex: 0 0 auto;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s ease;
    }
    .switch input:checked + .track { background: var(--brand); }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .switch input:focus-visible + .track { outline: 3px solid rgba(15, 118, 110, 0.45); outline-offset: 2px; }

    /* ===== Daftar size ===== */
    .list {
      --cols: 40px minmax(190px, 1.3fr) 120px 150px 72px 76px 90px 100px 124px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: clip;
    }

    .thead {
      position: sticky;
      top: var(--appbar-h);
      z-index: 5;
      display: grid;
      grid-template-columns: var(--cols);
      gap: 0 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
    }
    .thead .r { text-align: right; }

    .group {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--brand-50);
      color: var(--brand-700);
    }
    .group.g-B { background: #fffbeb; color: #92400e; }
    .group.g-AFKIR { background: #f1f5f9; color: #334155; }
    .group.is-new { background: var(--new-50); color: #1d4ed8; }

    .row {
      display: grid;
      grid-template-columns: var(--cols);
      gap: 0 8px;
      align-items: center;
      min-height: 60px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      transition: background 0.12s ease;
    }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: #f8fafc; }
    .row.filled { background: var(--brand-50); box-shadow: inset 3px 0 0 var(--brand); }
    .row.filled.is-new { background: var(--new-50); box-shadow: inset 3px 0 0 var(--new); }

    .c-no { color: var(--ink-3); font-size: 12px; }
    .c-size { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
    .c-kode { color: var(--ink-2); font-size: 13px; }
    .c-kode .mo { display: none; }
    .r { text-align: right; }
    .c-ekor, .c-kg, .c-pk, .c-pe, .c-total { text-align: right; font-size: 13px; color: var(--ink-2); }
    .c-total { font-size: 14px; font-weight: 700; color: var(--ink-3); }
    .row.filled .c-total { color: var(--money); }
    .row.filled .c-ekor, .row.filled .c-kg { color: var(--ink); font-weight: 600; }
    .c-pe { color: var(--ink); }
    .stat-label { display: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.b-A { background: var(--brand-100); color: var(--brand-700); }
    .badge.b-B { background: #fef3c7; color: #92400e; }
    .badge.b-AFKIR { background: #e2e8f0; color: #334155; }
    .badge.b-NEW { background: var(--new-100); color: #1d4ed8; }
    .badge.b-NEWTAG { background: var(--new); color: #fff; margin-left: -2px; }

    /* Highlight kuning untuk Grade B (qty lama) */
    .row.filled.g-B:not(.is-new) { background: #fffbeb; box-shadow: inset 3px 0 0 #f59e0b; }
    .row.filled.g-B:not(.is-new) .qty { color: #92400e; }
    .row.g-B:not(.is-new) .stepper:focus-within { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22); }
    .chip[data-filter="B"] .count { background: #d97706; }

    /* Highlight abu-abu untuk PS Afkir */
    .row.filled.g-AFKIR { background: #f1f5f9; box-shadow: inset 3px 0 0 #64748b; }
    .row.filled.g-AFKIR .qty { color: #334155; }
    .row.g-AFKIR .stepper:focus-within { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.22); }
    .chip[data-filter="AFKIR"] .count { background: #64748b; }

    /* NEW QTY Grade A: hijau campur biru */
    .group.is-new.g-A { background: linear-gradient(90deg, #ccfbf1 0%, #dbeafe 100%); color: #115e59; }
    .row.filled.is-new.g-A { background: linear-gradient(90deg, #d1fae5 0%, #eff6ff 100%); box-shadow: inset 3px 0 0 #10b981; }

    /* NEW QTY Grade B: kuning campur biru */
    .group.is-new.g-B { background: linear-gradient(90deg, #fef3c7 0%, #dbeafe 100%); color: #78350f; }
    .row.filled.is-new.g-B { background: linear-gradient(90deg, #fef3c7 0%, #eff6ff 100%); box-shadow: inset 3px 0 0 #f59e0b; }

    /* ===== Stepper jumlah karung ===== */
    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .stepper:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18); }
    .is-new .stepper:focus-within { border-color: var(--new); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }
    .step {
      width: 40px;
      height: 42px;
      border: 0;
      background: #f8fafc;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      line-height: 1;
    }
    .step:active { background: #e2e8f0; }
    .qty {
      width: 58px;
      height: 42px;
      border: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      background: transparent;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .qty::-webkit-outer-spin-button, .qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty:focus { outline: none; }
    .row.filled .qty { color: var(--brand-700); }
    .row.filled.is-new .qty { color: #1d4ed8; }

    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--ink-2);
    }
    .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

    .foot-note { margin: 12px 4px 0; font-size: 12px; color: var(--ink-2); }

    /* ===== Bar total (menempel di bawah) ===== */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: saturate(1.4) blur(14px);
      -webkit-backdrop-filter: saturate(1.4) blur(14px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.08);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .bar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .totals { flex: 1 1 auto; display: flex; align-items: center; gap: 28px; min-width: 0; }
    .tot .t-label { font-size: 12px; color: var(--ink-2); }
    .tot .t-value { font-size: 17px; font-weight: 800; line-height: 1.2; }
    .tot.grand .t-value { font-size: 24px; color: var(--money); letter-spacing: -0.01em; }
    .mini { display: none; font-size: 12px; color: var(--ink-2); }

    .btn-main {
      flex: 0 0 auto;
      height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), #0e7490);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-main:active { transform: translateY(1px); }
    .btn-reset {
      flex: 0 0 auto;
      height: 52px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      z-index: 40;
      max-width: calc(100vw - 32px);
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== Mobile: tiap size jadi kartu ===== */
    @media (max-width: 860px) {
      .search { flex: 1 1 180px; }
    }

    @media (max-width: 900px) {
      :root { --appbar-h: 58px; --bar-h: 76px; }
      .wrap { padding: 12px; }
      .appbar-inner { padding: 0 12px; }
      .appbar h1 { font-size: 16px; }
      .logo { width: 36px; height: 36px; font-size: 20px; }

      .panel { padding: 14px; }
      .fields { grid-template-columns: 1fr; }
      .select, .search { font-size: 16px; }

      .toolbar { margin: 14px 0 10px; }
      .chips { flex: 1 1 100%; margin: 0 -12px; padding: 2px 12px; }
      .search { flex: 1 1 0; min-width: 0; }

      .list { background: none; border: 0; box-shadow: none; overflow: visible; }
      .thead { display: none; }

      .group { border: 0; border-radius: 12px; margin: 14px 0 8px; padding: 9px 14px; }
      .group:first-child { margin-top: 0; }

      .row {
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 0.9fr) minmax(0, 1fr) minmax(126px, 1.3fr);
        grid-template-areas:
          "size size size qty"
          "kode kode kode qty"
          "ekor kg pe total";
        gap: 4px 8px;
        padding: 14px;
        margin-bottom: 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .row:last-child { border-bottom: 1px solid var(--line); }
      .row.filled { border-color: #5eead4; box-shadow: none; }
      .row.filled.is-new { border-color: #93c5fd; box-shadow: none; }

      .c-no, .c-pk { display: none; }
      .c-size { grid-area: size; font-size: 20px; align-self: end; }
      .c-kode { grid-area: kode; align-self: start; font-size: 12px; }
      .c-kode .mo { display: inline; }
      .c-qty { grid-area: qty; justify-self: end; align-self: center; }
      .step { width: 46px; height: 48px; font-size: 22px; }
      .qty { width: 60px; height: 48px; font-size: 18px; }

      .c-ekor, .c-kg, .c-pe, .c-total {
        text-align: left;
        padding-top: 10px;
        margin-top: 6px;
        border-top: 1px dashed var(--line);
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .c-ekor { grid-area: ekor; }
      .c-kg { grid-area: kg; }
      .c-pe { grid-area: pe; }
      .c-total { grid-area: total; text-align: right; color: var(--ink-3); }
      .stat-label { display: block; font-size: 11px; font-weight: 500; color: var(--ink-3); margin-bottom: 1px; }
      .c-total .stat-label { text-align: right; }

      .totals .tot:not(.grand) { display: none; }
      .tot.grand .t-value { font-size: 21px; }
      .mini { display: block; }
      .btn-main { height: 50px; padding: 0 16px; }
      .btn-main .ico { display: none; }
      .mini { white-space: nowrap; font-size: 11.5px; }
      .btn-reset { height: 50px; padding: 0 14px; }
      .btn-reset .lbl { display: none; }
    }

    /* ===== Mobile: versi lebih ringkas ===== */
    @media (max-width: 900px) {
      :root { --appbar-h: 52px; --bar-h: 64px; }
      body { font-size: 13px; }
      .logo { width: 32px; height: 32px; font-size: 18px; border-radius: 10px; }
      .appbar h1 { font-size: 15px; }
      .appbar .company { font-size: 11px; }
      .wrap { padding: 10px; }

      .panel { padding: 12px; border-radius: 14px; }
      .fields { gap: 10px; }
      .field label { font-size: 12px; margin-bottom: 4px; }
      .select { height: 42px; font-size: 15px; padding-left: 12px; }
      .hint { margin-top: 10px; font-size: 12px; }
      .stamp { font-size: 11px; padding: 3px 8px; }

      .toolbar { margin: 12px 0 8px; gap: 8px; }
      .chip { height: 34px; padding: 0 12px; font-size: 12px; }
      .chip .count { min-width: 18px; height: 18px; font-size: 10px; }
      .search { height: 38px; font-size: 16px; }
      .switch { font-size: 12px; }

      .group { font-size: 12px; padding: 7px 12px; margin: 10px 0 6px; border-radius: 10px; }
      .row { padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; gap: 2px 8px; }
      .c-size { font-size: 17px; }
      .c-kode { font-size: 11px; }
      .step { width: 38px; height: 40px; font-size: 18px; }
      .qty { width: 48px; height: 40px; font-size: 16px; }
      .c-ekor, .c-kg, .c-pe, .c-total { padding-top: 8px; margin-top: 4px; font-size: 13px; }
      .stat-label { font-size: 10px; }
      .c-total { white-space: nowrap; }
      .foot-note { font-size: 11px; }

      .bar { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
      .t-label { font-size: 11px; }
      .tot.grand .t-value { font-size: 18px; }
      .mini { font-size: 11px; }
      .btn-main { height: 44px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
      .btn-reset { height: 44px; padding: 0 12px; border-radius: 12px; }
      .toast { font-size: 13px; }
    }

    @media (max-width: 900px) {

// ===== Utilitas =====
function formatRupiah(number) {
  if (isNaN(number)) return "Rp 0";
  return "Rp " + number.toLocaleString("id-ID");
}

function fmt(n) { return (n || 0).toLocaleString("id-ID"); }
function fmtKg(n) { return n.toLocaleString("id-ID", { maximumFractionDigits: 2 }); }

function parseSizeMidWeight(size) {
  const tokens = String(size).split(" ");
  if (tokens[0] === ">=" && tokens.length > 1) {
    const num = parseFloat(tokens[1]);
    return isNaN(num) ? 3.0 : num;
  }
  if (tokens[0] === "<=" && tokens.length > 1) return 0.55;
  const parts = tokens[0].split("-");
  if (parts.length === 2) {
    const a = parseFloat(parts[0]);
    const b = parseFloat(parts[1]);
    if (!isNaN(a) && !isNaN(b)) return (a + b) / 2;
  }
  return 1;
}

function gradeOf(size) {
  return size.includes("PS Afkir") ? "AFKIR" : (size.includes("Grade B") ? "B" : "A");
}

function baseSize(size) {
  return size.replace(" Grade B", "").replace(" PS Afkir", "");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ===== State =====
const state = { moq: "10", filter: "all", query: "", onlyFilled: false, rows: [] };

const listEl = document.getElementById("list");
const chipsEl = document.getElementById("chips");
const moqSelect = document.getElementById("moq-select");
const customerSelect = document.getElementById("customer-select");

const FILTERS = [
  { key: "all", label: "Semua" },
  { key: "A", label: "Grade A" },
  { key: "B", label: "Grade B" },
  { key: "AFKIR", label: "PS Afkir" },
  { key: "NEW", label: "New Qty" }
];

function makeRow(r, isNew) {
  return {
    size: r.size,
    priceKg: r.priceKg || 0,
    priceEkor: r.priceEkor || 0,
    isNew: isNew,
    grade: gradeOf(r.size),
    kode: isNew ? (newItemCodes[r.size] || "-") : getKodeItem(r.size),
    perBox: (isNew ? newPiecesPerBox[r.size] : piecesPerBox[r.size]) || 1,
    box: 0
  };
}

function buildRows() {
  const data = priceTables[state.moq] || [];
  const rows = [];
  data.forEach(r => rows.push(makeRow(r, false)));
  data.filter(r => newPiecesPerBox[r.size] !== undefined)
      .forEach(r => rows.push(makeRow(r, true)));
  state.rows = rows;
}

function calc(row) {
  const ekor = row.box * row.perBox;
  const mid = parseSizeMidWeight(row.size);
  const kg = (row.size.includes(">= 3.0") || mid >= 3.0) ? ekor * 3.2 : ekor * mid;
  return { ekor: ekor, kg: kg, total: ekor * row.priceEkor };
}

function matchesFilter(row) {
  switch (state.filter) {
    case "A": return !row.isNew && row.grade === "A";
    case "B": return !row.isNew && row.grade === "B";
    case "AFKIR": return row.grade === "AFKIR";
    case "NEW": return row.isNew;
    default: return true;
  }
}

function isVisible(row) {
  if (!matchesFilter(row)) return false;
  if (state.onlyFilled && row.box <= 0) return false;
  const q = state.query.trim().toLowerCase();
  if (q && (row.size + " " + row.kode).toLowerCase().indexOf(q) === -1) return false;
  return true;
}

function groupKey(row) { return (row.isNew ? "NEW-" : "") + row.grade; }

function groupLabel(row) {
  const g = row.grade === "AFKIR" ? "PS Afkir" : "Grade " + row.grade;
  return row.isNew ? "New Qty, " + g : g;
}

// ===== Render =====
function rowHtml(row, i, num) {
  const g = row.grade;
  const badge = row.isNew
    ? '<span class="badge b-' + g + '">' + g + '</span><span class="badge b-NEWTAG">NEW</span>'
    : '<span class="badge b-' + g + '">' + (g === "AFKIR" ? "Afkir" : g) + '</span>';
  const pk = row.priceKg > 0 ? fmt(row.priceKg) : "-";
  const pkMobile = row.priceKg > 0 ? '<span class="mo"> | Rp ' + pk + '/kg</span>' : "";
  return '' +
    '<div class="row g-' + g + (row.isNew ? ' is-new' : '') + (row.box > 0 ? ' filled' : '') + '" data-i="' + i + '" role="group" aria-label="Size ' + esc(row.size) + '">' +
      '<div class="c-no">' + num + '</div>' +
      '<div class="c-size">' + esc(baseSize(row.size)) + badge + '</div>' +
      '<div class="c-kode">' + esc(row.kode) + pkMobile + '</div>' +
      '<div class="c-qty"><div class="stepper">' +
        '<button type="button" class="step" data-act="minus" aria-label="Kurangi karung">−</button>' +
        '<input class="qty" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="' + (row.box > 0 ? row.box : '') + '" aria-label="Jumlah karung size ' + esc(row.size) + '">' +
        '<button type="button" class="step" data-act="plus" aria-label="Tambah karung">+</button>' +
      '</div></div>' +
      '<div class="c-ekor num"><span class="stat-label">Ekor</span><span class="v"></span></div>' +
      '<div class="c-kg num"><span class="stat-label">Kg</span><span class="v"></span></div>' +
      '<div class="c-pk num">' + pk + '</div>' +
      '<div class="c-pe num"><span class="stat-label">Harga/ekor</span>' + fmt(row.priceEkor) + '</div>' +
      '<div class="c-total num"><span class="stat-label">Total</span><span class="v"></span></div>' +
    '</div>';
}

function renderList() {
  let html = '<div class="thead" role="presentation">' +
    '<div>No</div><div>Size</div><div>Kode item</div><div>Karung</div>' +
    '<div class="r">Ekor</div><div class="r">T.Kg</div><div class="r">Harga/kg</div><div class="r">Harga/ekor</div><div class="r">Total</div></div>';

  let lastGroup = null;
  let shown = 0;
  const counters = { old: 0, nw: 0 };

  state.rows.forEach((row, i) => {
    const num = row.isNew ? ++counters.nw : ++counters.old;
    if (!isVisible(row)) return;
    shown++;
    const gk = groupKey(row);
    if (gk !== lastGroup) {
      html += '<div class="group g-' + row.grade + (row.isNew ? ' is-new' : '') + '">' + esc(groupLabel(row)) + '</div>';
      lastGroup = gk;
    }
    html += rowHtml(row, i, num);
  });

  if (!shown) {
    const filledOnly = state.onlyFilled && !state.query.trim() && state.filter === "all";
    html += '<div class="empty"><strong>' +
      (filledOnly ? 'Belum ada jumlah yang diisi' : 'Size tidak ditemukan') + '</strong>' +
      (filledOnly ? 'Matikan "Hanya yang terisi" untuk mengisi jumlah karung.' : 'Coba kata kunci lain atau pilih filter Semua.') +
      '</div>';
  }

  listEl.innerHTML = html;
  listEl.querySelectorAll(".row").forEach(el => updateRowCells(el));
  renderChips();
  updateSummary();
}

function updateRowCells(el) {
  const row = state.rows[+el.dataset.i];
  const c = calc(row);
  el.querySelector(".c-ekor .v").textContent = fmt(c.ekor);
  el.querySelector(".c-kg .v").textContent = fmtKg(c.kg);
  el.querySelector(".c-total .v").textContent = formatRupiah(c.total);
  el.classList.toggle("filled", row.box > 0);
}

function renderChips() {
  const totals = {}, filled = {};
  FILTERS.forEach(f => { totals[f.key] = 0; filled[f.key] = 0; });
  state.rows.forEach(row => {
    FILTERS.forEach(f => {
      if (f.key === "all") { totals.all++; if (row.box > 0) filled.all++; return; }
      const hit =
        (f.key === "A" && !row.isNew && row.grade === "A") ||
        (f.key === "B" && !row.isNew && row.grade === "B") ||
        (f.key === "AFKIR" && row.grade === "AFKIR") ||
        (f.key === "NEW" && row.isNew);
      if (hit) { totals[f.key]++; if (row.box > 0) filled[f.key]++; }
    });
  });

  if (state.filter !== "all" && !totals[state.filter]) state.filter = "all";

  chipsEl.innerHTML = FILTERS.filter(f => totals[f.key] > 0).map(f =>
    '<button type="button" class="chip" data-filter="' + f.key + '" aria-pressed="' + (state.filter === f.key) + '">' +
      f.label +
      '<span class="count' + (filled[f.key] > 0 ? ' show' : '') + '">' + filled[f.key] + '</span>' +
    '</button>'
  ).join("");
}

function updateChipCounts() {
  const filled = { all: 0, A: 0, B: 0, AFKIR: 0, NEW: 0 };
  state.rows.forEach(row => {
    if (row.box <= 0) return;
    filled.all++;
    if (row.isNew) filled.NEW++;
    else filled[row.grade]++;
    if (row.grade === "AFKIR" && row.isNew) filled.AFKIR++;
  });
  chipsEl.querySelectorAll(".chip").forEach(chip => {
    const n = filled[chip.dataset.filter] || 0;
    const badge = chip.querySelector(".count");
    badge.textContent = n;
    badge.classList.toggle("show", n > 0);
  });
}

function updateSummary() {
  let box = 0, ekor = 0, kg = 0, grand = 0;
  state.rows.forEach(row => {
    if (row.box <= 0) return;
    const c = calc(row);
    box += row.box; ekor += c.ekor; kg += c.kg; grand += c.total;
  });
  document.getElementById("sum-box").textContent = fmt(box);
  document.getElementById("sum-ekor").textContent = fmt(ekor);
  document.getElementById("sum-kg").textContent = fmtKg(kg);
  document.getElementById("sum-grand").textContent = formatRupiah(grand);
  document.getElementById("mini-line").textContent = fmt(box) + " karung, " + fmt(ekor) + " ekor, " + fmtKg(kg) + " kg";
}

function setBox(el, value) {
  const row = state.rows[+el.dataset.i];
  row.box = Math.max(0, parseFloat(value) || 0);
  updateRowCells(el);
  updateSummary();
  updateChipCounts();
}

// ===== Event: daftar size =====
listEl.addEventListener("input", e => {
  if (!e.target.classList.contains("qty")) return;
  setBox(e.target.closest(".row"), e.target.value);
});

listEl.addEventListener("click", e => {
  const btn = e.target.closest(".step");
  if (!btn) return;
  const rowEl = btn.closest(".row");
  const input = rowEl.querySelector(".qty");
  const cur = parseFloat(input.value) || 0;
  const next = btn.dataset.act === "plus" ? cur + 1 : Math.max(0, cur - 1);
  input.value = next > 0 ? next : "";
  setBox(rowEl, next);
});

listEl.addEventListener("focusin", e => {
  if (e.target.classList.contains("qty")) e.target.select();
});

listEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("qty")) return;
  e.preventDefault();
  const inputs = Array.from(listEl.querySelectorAll(".qty"));
  const next = inputs[inputs.indexOf(e.target) + 1];
  if (next) next.focus(); else e.target.blur();
});

// ===== Event: filter, cari, switch =====
chipsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  state.filter = chip.dataset.filter;
  renderList();
});

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value;
  renderList();
});

document.getElementById("only-filled").addEventListener("change", e => {
  state.onlyFilled = e.target.checked;
  renderList();
});

// ===== Event: jenis harga & customer =====
function anyFilled() { return state.rows.some(r => r.box > 0); }

moqSelect.addEventListener("change", () => {
  const hadInput = anyFilled();
  state.moq = moqSelect.value;
  state.filter = "all";
  state.query = "";
  document.getElementById("search").value = "";
  populateCustomers(state.moq);
  buildRows();
  renderList();
  if (hadInput) showToast("Harga diganti, jumlah karung direset");
});

document.getElementById("btn-reset").addEventListener("click", () => {
  if (anyFilled() && !confirm("Hapus semua jumlah karung yang sudah diisi?")) return;
  state.rows.forEach(r => { r.box = 0; });
  customerSelect.value = "";
  renderList();
  showToast("Semua jumlah sudah direset");
});

// ===== Toast =====
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ===== Buat FO (format sama seperti sebelumnya) =====
function getTanggalKirimText() {
  const today = new Date();
  const day = today.getDay();

  let kirimDate = new Date(today);
  let label = "besok";

  if (day === 6) {
    kirimDate.setDate(today.getDate() + 2);
    label = "Senin";
  } else if (day === 0) {
    kirimDate.setDate(today.getDate() + 1);
    label = "Senin";
  } else {
    kirimDate.setDate(today.getDate() + 1);
  }

  const options = { day: "numeric", month: "long", year: "numeric" };
  return label + " (" + kirimDate.toLocaleDateString("id-ID", options) + ")";
}

function buildFO() {
  const customerName = customerSelect.value;
  let text = "*FO Bebek*\n\n";
  text += "Kirim " + getTanggalKirimText() + "\n\n";
  let lastGrade = null;
  let newHeaderShown = false;
  let grandTotal = 0;

  state.rows.forEach(row => {
    if (row.box <= 0) return;
    const currentGrade = row.grade + (row.isNew ? "_NEW" : "");

    if (lastGrade !== currentGrade) {
      if (lastGrade !== null) text += "\n";
      if (row.isNew && !newHeaderShown) {
        text += "*NEW QTY :*\n\n";
        newHeaderShown = true;
      }
      const gradeLabel = (row.grade === "AFKIR" ? "PS Afkir" : "Grade " + row.grade) + (row.isNew ? " (NEW QTY)" : "");
      text += gradeLabel + "\n";
    }
    lastGrade = currentGrade;

    const c = calc(row);
    grandTotal += c.total;
    text += "• " + row.size + " (" + row.kode + ")" + " → " + row.box + " karung (" + fmt(c.ekor) + " ekor) @" + fmt(row.priceEkor) + "\n";
  });

  text += "\n *TOTAL : " + formatRupiah(grandTotal) + "*" + "\n\n";
  if (customerName) text += "*" + customerName + "*";
  return { text: text, grandTotal: grandTotal };
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

document.getElementById("btn-copy-wa").addEventListener("click", async () => {
  const fo = buildFO();
  if (fo.grandTotal === 0) {
    showToast("Isi dulu jumlah karung sebelum membuat FO");
    return;
  }
  const ok = await copyText(fo.text);
  showToast(ok ? "FO berhasil disalin" : "Gagal menyalin, coba lagi");
});

// ===== Admin (tersembunyi, buka dengan ?admin di alamat web) =====
if (new URLSearchParams(location.search).has("admin")) {
  document.getElementById("admin").classList.add("show");
}

document.getElementById("btn-import").addEventListener("click", () => {
  document.getElementById("import-excel").click();
});

document.getElementById("import-excel").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });
    const newPriceTables = {};

    workbook.SheetNames.forEach(sheetName => {
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
      const moq = sheetName.replace(/\D/g, "");
      newPriceTables[moq] = json.map(row => ({
        size: row["Size"],
        priceKg: parseFloat(String(row["Price/Kg"]).replace(/[^0-9]/g, "")) || 0,
        priceEkor: parseFloat(String(row["Price/Ekor"]).replace(/[^0-9]/g, "")) || 0
      }));
    });

    Object.assign(priceTables, newPriceTables);
    buildRows();
    renderList();
    showToast("Harga berhasil di-import dari Excel");
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById("btn-download-html").addEventListener("click", () => {
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const newData = JSON.stringify(priceTables, null, 2);

  html = html.replace(
    /const priceTables = \{[\s\S]*?\n  \};/,
    () => "const priceTables = " + newData + ";"
  );

  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "harga_bebek_updated.html";
  a.click();
  URL.revokeObjectURL(url);
});

// ===== Mulai =====
populateCustomers(state.moq);
buildRows();
renderList();
